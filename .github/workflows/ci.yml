name: CI

on:
  push:
    branches: [ocv]
  pull_request:
    branches: [ocv]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run vim tests
        run: bun test ./test/cli/tui/vim-*.test.ts
        working-directory: packages/tui
