name: OCV website

on:
  push:
    branches: [ocv]
    paths:
      - "docs/**"
      - package.json
      - .github/workflows/ocv-pages.yml
  pull_request:
    branches: [ocv]
    paths:
      - "docs/**"
      - package.json
      - .github/workflows/ocv-pages.yml
  workflow_dispatch:

concurrency:
  group: ocv-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'leohenon/opencode-vim'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun run build:site
      - name: Verify generated site is current
        run: git diff --exit-code -- docs/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ocv'
        with:
          path: docs

  deploy:
    needs: build
    if: github.repository == 'leohenon/opencode-vim' && github.event_name != 'pull_request' && github.ref == 'refs/heads/ocv'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
