name: pr-standards

on:
  pull_request_target:
    branches: [ocv1]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-standards:
    if: github.repository == 'leohenon/opencode-vim' && github.event.pull_request.base.ref == 'ocv1'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional PR title
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) || pr.user.type === 'Bot') {
              core.info('Skipping title check for maintainer or bot');
              return;
            }
            if (!/^(feat|fix|refactor|test|docs|ci|chore)(\([a-zA-Z0-9-]+\))?: \S/.test(pr.title)) {
              core.setFailed('PR title must follow type(scope): summary (scope optional). Types: feat, fix, refactor, test, docs, ci, chore. See CONTRIBUTING.md on ocv1.');
            }
