name: Schedule ocv1 sync

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify V1 synchronization without pushing or publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dispatch-sync-upstream-v1
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'leohenon/opencode-vim' && github.ref == 'refs/heads/ocv'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run }}
    steps:
      - name: Dispatch isolated V1 synchronization
        run: |
          [ -n "$GH_TOKEN" ] || { echo "SYNC_PAT with Actions write access is required" >&2; exit 1; }
          gh workflow run sync-upstream.yml --repo "$GITHUB_REPOSITORY" --ref ocv1 -f dry_run="$DRY_RUN"

  issues:
    name: Report v1 sync dispatch outcome
    needs: dispatch
    if: >-
      always() && !cancelled() &&
      github.repository == 'leohenon/opencode-vim' && github.ref == 'refs/heads/ocv' &&
      (github.event_name == 'schedule' || inputs.dry_run == false) &&
      (needs.dispatch.result == 'success' || needs.dispatch.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      OCV_ISSUE_MAJOR: v1
      OCV_ISSUE_WORKFLOW: sync-dispatch
      OCV_ISSUE_RESULT: ${{ needs.dispatch.result }}
      OCV_ISSUE_DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Update owned dispatch failure tracker
        run: bun .github/scripts/ocv-issues.ts
