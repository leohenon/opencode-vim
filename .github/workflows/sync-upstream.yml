name: Sync ocv with upstream
run-name: "Sync ocv v1 | ${{ github.ref_name }} | ${{ inputs.dry_run && 'dry-run' || 'real' }}"

on:
  # Scheduled by the default branch V1 dispatcher; schedules here would not run.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Merge and verify without pushing or publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: sync-upstream-v1
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leohenon/opencode-vim' && github.ref == 'refs/heads/ocv1'
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ocv1
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Merge upstream/v1
        id: merge
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream v1
          base=$(git show upstream/v1:packages/opencode/package.json | jq -r '.version')
          [[ "$base" =~ ^1\.[0-9]+\.[0-9]+$ ]] || { echo "Refusing non-V1 upstream source: $base" >&2; exit 1; }

          before=$(git rev-parse HEAD)
          nix_hash_conflict_resolved=false
          nix_hash_inputs_changed=false

          if ! git merge --no-commit --no-ff upstream/v1; then
            conflicts=$(git diff --name-only --diff-filter=U)
            other_conflicts=$(printf '%s\n' "$conflicts" | grep -Ev '^(AGENTS\.md|README\.md|install\.sh|\.github/ocv-track|nix/hashes\.json)$' || true)

            if [ -n "$other_conflicts" ]; then
              printf '%s\n' "$other_conflicts"
              exit 1
            fi

            for file in AGENTS.md README.md install.sh .github/ocv-track; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$file"; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            if printf '%s\n' "$conflicts" | grep -qx 'nix/hashes.json'; then
              tmp=$(mktemp -d)
              git show :2:nix/hashes.json > "$tmp/ours.json"
              git show :3:nix/hashes.json > "$tmp/theirs.json"
              python3 - "$tmp/ours.json" "$tmp/theirs.json" <<'PY'
          import json
          import sys

          systems = {"x86_64-linux", "aarch64-linux", "aarch64-darwin"}
          for path in sys.argv[1:]:
              with open(path) as f:
                  data = json.load(f)
              if set(data) != {"nodeModules"}:
                  raise SystemExit(f"Unsupported nix/hashes.json schema in {path}")
              hashes = data["nodeModules"]
              if set(hashes) != systems:
                  raise SystemExit(f"Unsupported nix/hashes.json systems in {path}")
              for system, value in hashes.items():
                  if not isinstance(value, str) or not value.startswith("sha256-"):
                      raise SystemExit(f"Unsupported nix hash for {system} in {path}")
          PY
              rm -rf "$tmp"

              echo "Resolving nix/hashes.json with current OCV hashes; native hash refresh will run after push."
              git checkout --ours -- nix/hashes.json
              git add nix/hashes.json
              nix_hash_conflict_resolved=true
            fi
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null && git cat-file -e HEAD:AGENTS.md 2>/dev/null; then
            echo "Keeping OCV AGENTS.md and ignoring upstream changes."
            git restore --source=HEAD --staged --worktree -- AGENTS.md README.md install.sh .github/ocv-track
          fi

          remaining_conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$remaining_conflicts" ]; then
            printf '%s\n' "$remaining_conflicts"
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(upstream): sync upstream v1"
          fi

          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ] && ! git diff --quiet "$before" "$after" -- \
            bun.lock \
            package.json \
            'packages/*/package.json' \
            flake.lock \
            nix/node_modules.nix \
            nix/scripts \
            patches; then
            nix_hash_inputs_changed=true
          fi

          # Dependency-input changes pushed to ocv1 already trigger nix-hashes.yml via
          # its push paths. Only dispatch manually for a resolved hashes.json conflict
          # that would otherwise be invisible to that push trigger.
          nix_hashes_needed=false
          if [ "$nix_hash_conflict_resolved" = true ] && [ "$nix_hash_inputs_changed" != true ]; then
            nix_hashes_needed=true
          fi

          echo "nix_hashes_needed=$nix_hashes_needed" >> "$GITHUB_OUTPUT"
          echo "nix_hash_inputs_changed=$nix_hash_inputs_changed" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - run: bun run typecheck
      - name: Check V1 fork behavior and release planning
        run: |
          (cd packages/tui && bun test ./test/cli/tui/vim-*.test.ts)
          (cd packages/opencode && bun test ./test/ocv-*.test.ts ./test/installation/installation.test.ts)

      - name: Check V1 releases and fork revision
        id: version
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/upstream-releases.json"
          releases="$RUNNER_TEMP/ocv-releases.json"
          gh release list --repo anomalyco/opencode --limit 1000 --json tagName,isDraft,isPrerelease > "$upstream"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft,isPrerelease > "$releases"
          plan=$(bun run packages/opencode/script/ocv-release.ts "$upstream" "$releases")
          previous=$(jq -r '.previous' <<< "$plan")
          track=$(tr -d '[:space:]' < .github/ocv-track)
          changed=false
          if [ -n "$previous" ] && [ "${previous##*-ocv.}" = "$track" ]; then
            git rev-parse --verify "$previous^{commit}" >/dev/null
            git merge-base --is-ancestor "$previous" HEAD
            while read -r sha; do
              prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[] | select((.base.ref == "ocv1" or .base.ref == "ocv") and .merged_at != null) | .number')
              if [ -n "$prs" ]; then changed=true; break; fi
            done < <(git log --first-parent --format='%H' "$previous..HEAD")
          fi
          plan=$(OCV_FORK_CHANGES="$changed" bun run packages/opencode/script/ocv-release.ts "$upstream" "$releases")
          echo "$plan" | jq .
          next=$(jq -r '.track' <<< "$plan")
          if [ "$next" != "$track" ]; then
            printf '%s\n' "$next" > .github/ocv-track
            git add .github/ocv-track
            git commit -m "chore(release): bump ocv v1 track"
          fi
          echo "release=$(jq -r '.version' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "publish=$(jq -r '.publish' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark release-managed Nix refresh
        if: >-
          steps.merge.outputs.nix_hash_inputs_changed == 'true' &&
          steps.version.outputs.publish == 'true'
        run: |
          git commit --amend -m "$(git log -1 --format=%B)

          [skip nix-hashes]"

      - name: Pin V1 release source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.release }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if jq -e --arg tag "v$VERSION" '.[] | select(.tagName == $tag and .isDraft)' "$RUNNER_TEMP/ocv-releases.json" >/dev/null; then
            sha=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          elif git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" >/dev/null; then
            sha=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          fi
          git merge-base --is-ancestor "$sha" HEAD
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Push synchronized V1 branch
        if: inputs.dry_run == false
        run: git push origin HEAD:ocv1

      - name: Trigger Nix hash refresh
        if: inputs.dry_run == false && steps.merge.outputs.nix_hashes_needed == 'true' && steps.version.outputs.publish != 'true'
        run: gh workflow run nix-hashes.yml --repo "$GITHUB_REPOSITORY" --ref ocv1

      - name: Trigger V1 release
        if: inputs.dry_run == false && steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.release }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          FORCE_NIX_HASH_REFRESH: ${{ steps.merge.outputs.nix_hashes_needed }}
        run: gh workflow run publish-ocv.yml --repo "$GITHUB_REPOSITORY" --ref ocv1 -f version="$VERSION" -f sha="$RELEASE_SHA" -f dry_run=false -f force_nix_hash_refresh="$FORCE_NIX_HASH_REFRESH"

      - name: Close failure issue on success
        if: success() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues=$(gh issue list --repo ${{ github.repository }} --state open --limit 1000 --json number,title -q '.[] | select(.title == "[ci]: sync upstream v1 failed" or .title == "[actions]: sync upstream v1 failed") | .number')
          if [ -z "$issues" ]; then
            exit 0
          fi
          printf '%s\n' "$issues" | while read -r number; do
            gh issue close "$number" --repo ${{ github.repository }} --comment "Closed automatically after a successful sync run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Notify on failure
        if: failure() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci --repo ${{ github.repository }} --color D73A4A --description "Continuous integration" 2>/dev/null || true
          issues=$(gh issue list --repo ${{ github.repository }} --state open --limit 1000 --json number,title -q '.[] | select(.title == "[ci]: sync upstream v1 failed" or .title == "[actions]: sync upstream v1 failed") | [.number, .title] | @tsv')
          tracker=$(printf '%s\n' "$issues" | awk -F '\t' '$2 == "[ci]: sync upstream v1 failed" { print $1; exit }')
          if [ -z "$tracker" ]; then
            tracker=$(printf '%s\n' "$issues" | awk -F '\t' 'NF { print $1; exit }')
            if [ -n "$tracker" ]; then
              gh issue edit "$tracker" --repo ${{ github.repository }} --title "[ci]: sync upstream v1 failed" --add-label ci
            fi
          fi
          if [ -z "$tracker" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "[ci]: sync upstream v1 failed" \
              --label ci \
              --body "Sync workflow failed. Likely a merge conflict. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            exit 0
          fi
          gh issue edit "$tracker" --repo ${{ github.repository }} --add-label ci
          printf '%s\n' "$issues" | awk -F '\t' -v tracker="$tracker" 'NF && $1 != tracker { print $1 }' | while read -r number; do
            gh issue close "$number" --repo ${{ github.repository }} --comment "Closing duplicate; tracking this failure in #$tracker."
          done
