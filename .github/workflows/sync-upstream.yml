name: Sync ocv with upstream/dev
run-name: Sync ocv with upstream/dev

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Merge and verify without pushing or publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: sync-upstream-v2
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leohenon/opencode-vim' && github.ref == 'refs/heads/ocv'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ocv
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Merge upstream/dev
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/anomalyco/opencode.git
          # Keep upstream tags separate from fork tags, including annotated tags.
          git fetch --no-tags upstream dev '+refs/tags/v2.*:refs/upstream-tags/v2.*'
          upstream="$RUNNER_TEMP/upstream-tags.json"
          git for-each-ref --format='%(refname:strip=2)' refs/upstream-tags/ |
            jq -Rsc 'split("\n") | map(select(test("^v2\\.[0-9]+\\.[0-9]+$")))' > "$upstream"
          base=$(git show upstream/dev:packages/core/package.json | jq -r '.version')
          [[ "$base" =~ ^2\.[0-9]+\.[0-9]+$ ]] || { echo "Refusing non-V2 upstream source: $base" >&2; exit 1; }
          # Tags gate publication; the tested fork deliberately includes newer dev work.
          if ! git merge --no-commit --no-ff upstream/dev; then
            conflicts=$(git diff --name-only --diff-filter=U)
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  bun run packages/cli/script/ocv-sync.ts "$file"
                  ;;
              esac
            done <<< "$conflicts"
            conflicts=$(git diff --name-only --diff-filter=U)
            other=$(printf '%s\n' "$conflicts" | grep -Ev '^(AGENTS\.md|README\.md|install\.sh|\.github/ocv-track|package\.json|packages/cli/package\.json|bun\.lock)$' || true)
            [ -z "$other" ] || { printf '%s\n' "$other"; exit 1; }
            for file in package.json packages/cli/package.json bun.lock; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$file"; then
                bun run packages/cli/script/ocv-sync.ts "$file"
              fi
            done
            for file in AGENTS.md README.md install.sh .github/ocv-track; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$file"; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done
          fi
          [ -z "$(git diff --name-only --diff-filter=U)" ]
          [ "$(jq -r '.version' packages/core/package.json)" = "$base" ] || {
            echo "Merged source version does not match upstream/dev $base" >&2
            exit 1
          }
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # Keep fork documentation and release identity even for clean upstream merges.
            git restore --source=HEAD --staged --worktree -- AGENTS.md README.md install.sh .github/ocv-track
            git commit -m "chore(upstream): sync upstream dev"
          fi

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run --cwd packages/cli test
      - run: bun run --cwd packages/tui test
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"

      - name: Check V2 releases and fork revision
        id: release
        shell: bash
        env:
          BEFORE: ${{ steps.merge.outputs.before }}
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/upstream-tags.json"
          releases="$RUNNER_TEMP/ocv-releases.json"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft > "$releases"
          plan=$(bun run packages/cli/script/ocv-release.ts "$upstream" "$releases")
          previous=$(jq -r '.previous' <<< "$plan")
          track=$(tr -d '[:space:]' < .github/ocv-track)
          changed=false
          if [ -n "$previous" ] && [ "${previous##*-ocv.}" = "$track" ]; then
            git rev-parse --verify "$previous^{commit}" >/dev/null
            git merge-base --is-ancestor "$previous" "$BEFORE"
            while read -r sha; do
              prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[] | select(.base.ref == "ocv" and .merged_at != null) | .number')
              if [ -n "$prs" ]; then
                changed=true
                break
              fi
            done < <(git log --first-parent --format='%H' "$previous..$BEFORE")
          fi
          plan=$(OCV_FORK_CHANGES="$changed" bun run packages/cli/script/ocv-release.ts "$upstream" "$releases")
          echo "$plan" | jq .
          next=$(jq -r '.track' <<< "$plan")
          if [ "$next" != "$track" ]; then
            printf '%s\n' "$next" > .github/ocv-track
            git add .github/ocv-track
            git commit -m "chore(release): bump ocv track"
          fi
          version=$(jq -r '.version' <<< "$plan")
          sha=$(git rev-parse HEAD)
          if jq -e --arg tag "v$version" '.[] | select(.tagName == $tag and .isDraft)' "$releases" >/dev/null; then
            # A draft may not have a Git tag yet. Resume its exact source commit.
            sha=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$sha" HEAD
          elif git rev-parse --verify "refs/tags/v$version^{commit}" >/dev/null 2>&1; then
            sha=$(git rev-parse "refs/tags/v$version^{commit}")
            git merge-base --is-ancestor "$sha" HEAD
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publish=$(jq -r '.publish' <<< "$plan")" >> "$GITHUB_OUTPUT"

      - name: Push synchronized OCV branch
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: git push origin HEAD:ocv

      - name: Trigger V2 beta release
        if: steps.release.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: gh workflow run publish-ocv.yml --repo "$GITHUB_REPOSITORY" --ref ocv -f version="$VERSION" -f sha="$RELEASE_SHA" -f dry_run=false

  issues:
    name: Report sync outcome
    needs: sync
    if: >-
      always() && !cancelled() &&
      github.repository == 'leohenon/opencode-vim' && github.ref == 'refs/heads/ocv' &&
      (github.event_name == 'schedule' || inputs.dry_run == false) &&
      (needs.sync.result == 'success' || needs.sync.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      OCV_ISSUE_MAJOR: v2
      OCV_ISSUE_WORKFLOW: sync
      OCV_ISSUE_RESULT: ${{ needs.sync.result }}
      OCV_ISSUE_DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Update owned failure tracker
        run: bun .github/scripts/ocv-issues.ts
