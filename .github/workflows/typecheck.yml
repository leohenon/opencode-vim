name: typecheck

on:
  push:
    branches: [ocv1]
  pull_request:
    branches: [ocv1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    if: >-
      github.repository == 'leohenon/opencode-vim' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'ocv1') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/ocv1'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Run typecheck
        run: bun typecheck
